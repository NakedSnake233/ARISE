apiVersion: v1
kind: ServiceAccount
metadata:
  name: care-prometheus
  namespace: care-tt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: care-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: care-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: care-prometheus
subjects:
  - kind: ServiceAccount
    name: care-prometheus
    namespace: care-tt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: care-prometheus
  namespace: care-tt
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: care-tt
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: care-prometheus
  namespace: care-tt
spec:
  replicas: 1
  selector:
    matchLabels: {app: care-prometheus}
  template:
    metadata:
      labels: {app: care-prometheus}
    spec:
      serviceAccountName: care-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=24h, --storage.tsdb.retention.size=2GB]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: care-prometheus}
        - name: data
          emptyDir: {sizeLimit: 3Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: care-prometheus
  namespace: care-tt
spec:
  selector: {app: care-prometheus}
  ports: [{port: 9090, targetPort: 9090}]
